name: Update vendored skills

on:
  workflow_dispatch:
  schedule:
    - cron: '19 2 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-vendored-skills
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          registry-url: https://registry.npmjs.org

      - name: Sync pkg-skills lookup table
        run: node ./packages/pkg-skills/scripts/sync-lookup.mjs

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-vendored-skills
          commit-message: 'chore: update vendored skills'
          title: 'chore: update vendored skills'
          labels: enhancement
          body: |
            Automated nightly refresh of vendored skills.

            This updates the vendored `.agents/skills` content and any related lockfile changes produced by `npx skills update`.
          delete-branch: true
