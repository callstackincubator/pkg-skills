name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Prepare release notes
        id: notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const tag = process.env.TAG_NAME;
          const version = tag.startsWith('v') ? tag.slice(1) : tag;
          const text = fs.readFileSync('CHANGELOG.md', 'utf8');
          const lines = text.split(/\n/);
          const header = `## ${version}`;
          const idx = lines.findIndex((l) => l === header);
          const delim = 'RELEASE_BODY_' + Math.random().toString(36).slice(2);
          if (idx === -1) {
            console.log(`body<<${delim}`);
            console.log(
              `Release ${tag}. See [CHANGELOG.md](https://github.com/${process.env.GITHUB_REPOSITORY}/blob/${tag}/CHANGELOG.md).`
            );
            console.log(delim);
            process.exit(0);
          }
          const out = [];
          for (let i = idx + 1; i < lines.length; i++) {
            if (lines[i].startsWith('## ')) break;
            out.push(lines[i]);
          }
          const body = out.join('\n').trim();
          console.log(`body<<${delim}`);
          console.log(body.length ? body : `Release ${tag}.`);
          console.log(delim);
          NODE

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm exec changeset publish

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
