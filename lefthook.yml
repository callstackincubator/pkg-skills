pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{js,ts,jsx,tsx,json,md,yml,yaml}'
      run: pnpm prettier --write {staged_files}
      stage_fixed: true

    lint:
      glob: '*.{js,ts,jsx,tsx}'
      run: yarn lint

    typecheck:
      glob: '*.{js,ts,jsx,tsx}'
      run: yarn typecheck

commit-msg:
  parallel: true
  commands:
    commitlint:
      run: npx commitlint --edit
